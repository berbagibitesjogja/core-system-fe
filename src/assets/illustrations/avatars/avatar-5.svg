  <!-- Neck -->
  <rect x="44" y="55" width="12" height="15" rx="5" fill="#E2A169" />

  <!-- Head -->
  <ellipse cx="50" cy="48" rx="20" ry="22" fill="#F8C496" />

  <!-- Ears -->
  <circle cx="30" cy="49" r="4" fill="#E2A169" />
  <circle cx="70" cy="49" r="4" fill="#E2A169" />

