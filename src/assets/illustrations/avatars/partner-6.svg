  <!-- Eyes -->
  <circle cx="42" cy="46" r="2.4" fill="#1E293B" />
  <circle cx="58" cy="46" r="2.4" fill="#1E293B" />
  <circle cx="43" cy="45" r="0.8" fill="#FFFFFF" />
  <circle cx="59" cy="45" r="0.8" fill="#FFFFFF" />

  <!-- Cheerful Smile -->
