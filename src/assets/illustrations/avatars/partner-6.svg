  <!-- Cheeks Blush -->
  <ellipse cx="35" cy="51" rx="3.4" ry="2.1" fill="#FB7185" opacity="0.4" />
  <ellipse cx="65" cy="51" rx="3.4" ry="2.1" fill="#FB7185" opacity="0.4" />
</svg>
