  <!-- Hair Back -->
  <path d="M26 42 C26 62 34 68 34 68 L66 68 C66 68 74 62 74 42 C74 24 64 19 50 19 C36 19 26 24 26 42 Z" fill="#5C3317" />

  <!-- Shoulders / Clothes (Bondi Teal Top) -->
  <path d="M19 96 C21 75 35 68 50 68 C65 68 79 75 81 96 Z" fill="#007D85" />
  <circle cx="50" cy="68" r="7" fill="#E6F5F6" />

  <!-- Neck -->
  <rect x="44" y="55" width="12" height="15" rx="5" fill="#E5B287" />

  <!-- Head -->
  <ellipse cx="50" cy="47" rx="20" ry="22" fill="#FCE7D2" />

  <!-- Ears -->
  <circle cx="30" cy="48" r="4" fill="#E5B287" />
  <circle cx="70" cy="48" r="4" fill="#E5B287" />

  <!-- Hair Front -->
