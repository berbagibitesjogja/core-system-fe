<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Background Circle (Soft Sky Blue) -->
  <circle cx="50" cy="50" r="50" fill="#E0F2FE" />

  <!-- Top Hair Bun -->
  <circle cx="50" cy="18" r="11" fill="#4A2810" />

  <!-- Shoulders / Clothes (Terracotta Jacket) -->
  <path d="M19 96 C21 75 35 68 50 68 C65 68 79 75 81 96 Z" fill="#EA580C" />
  <path d="M44 68 L50 82 L56 68 Z" fill="#FFFFFF" />

  <!-- Neck -->
  <rect x="44" y="55" width="12" height="15" rx="5" fill="#E0A97E" />

  <!-- Head -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="#FCD9BD" />

  <!-- Ears with cute small earrings -->
  <circle cx="30" cy="47" r="4" fill="#E0A97E" />
  <circle cx="70" cy="47" r="4" fill="#E0A97E" />
  <circle cx="30" cy="51" r="1.5" fill="#F59E0B" />
  <circle cx="70" cy="51" r="1.5" fill="#F59E0B" />

  <!-- Hair Outline & Front -->
  <path d="M30 40 C30 24 40 22 50 22 C60 22 70 24 70 40 C66 33 58 31 50 31 C42 31 34 33 30 40 Z" fill="#5C3317" />
  <!-- Side strands -->
  <path d="M30 40 C28 47 30 54 32 56 C30 52 30 46 32 40 Z" fill="#5C3317" />
  <path d="M70 40 C72 47 70 54 68 56 C70 52 70 46 68 40 Z" fill="#5C3317" />

  <!-- Eyes -->
  <ellipse cx="42" cy="45" rx="2.5" ry="3" fill="#1E293B" />
  <ellipse cx="58" cy="45" rx="2.5" ry="3" fill="#1E293B" />
  <circle cx="43" cy="44" r="0.9" fill="#FFFFFF" />
  <circle cx="59" cy="44" r="0.9" fill="#FFFFFF" />

  <!-- Eyelashes -->
  <path d="M39 42 L42 43" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />
  <path d="M61 42 L58 43" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Friendly Smile with Lipstick -->
  <path d="M44 54 C46 58 54 58 56 54" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" />

  <!-- Blush -->
  <circle cx="36" cy="49" r="3.2" fill="#F87171" opacity="0.4" />
  <circle cx="64" cy="49" r="3.2" fill="#F87171" opacity="0.4" />
</svg>
